[package]
name = "freeport-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Libère un port en arrêtant proprement le processus qui l'occupe (Linux, macOS, Windows, BSD)"
license = "MIT"
readme = "README.md"
exclude = [".github/"]
repository = "https://github.com/cyrilleadjalala/freeport"
keywords = ["port", "kill", "process", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "freeport"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
listeners = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
