[package]
name = "freeport-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Free a port by stopping the process that holds it (Linux, macOS, Windows, BSD)"
license = "MIT"
readme = "README.md"
exclude = [".github/", "tests/install_test.*"]
repository = "https://github.com/cyrilleadjalala/freeport"
keywords = ["port", "kill", "process", "cli", "network"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "freeport"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
listeners = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo binstall freeport-cli` downloads the release binary instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/freeport-v{ version }-{ target }.tar.gz"
bin-dir = "freeport-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/freeport-v{ version }-{ target }.zip"
pkg-fmt = "zip"
