name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Vérifier la version
        id: check
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$v de Cargo.toml"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "freeport-ci (https://github.com/cyrilleadjalala/freeport)" \
            "https://crates.io/api/v1/crates/freeport-cli/$v")
          if [ "$code" = 200 ]; then
            echo "freeport-cli $v est déjà sur crates.io : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier sur crates.io
        if: steps.check.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
