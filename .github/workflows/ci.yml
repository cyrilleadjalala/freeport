name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The .exe must not depend on the Visual C++ runtime (missing on a clean Windows).
      - name: Check the C runtime is static (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          if (Select-String -Path target\release\freeport.exe -Pattern "VCRUNTIME140" -Quiet) {
            throw "freeport.exe imports VCRUNTIME140.dll: the C runtime is not static"
          }

  # The installers: against the latest published release, as users run them, and
  # offline against a fake release (checksum checks).
  installers:
    name: install-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          FREEPORT_INSTALL_DIR="$RUNNER_TEMP/bin" sh ./install.sh
          "$RUNNER_TEMP/bin/freeport" --version
      - name: install.sh offline tests (checksums)
        if: runner.os != 'Windows'
        run: sh tests/install_test.sh
      - name: install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FREEPORT_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          & "$env:RUNNER_TEMP\bin\freeport.exe" --version
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FREEPORT_INSTALL_DIR = "$env:RUNNER_TEMP\bin51"
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          & "$env:RUNNER_TEMP\bin51\freeport.exe" --version
      - name: install.ps1 offline tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install_test.ps1
      - name: install.ps1 offline tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/install_test.ps1

  # Static Linux binaries (musl), as published in the releases.
  musl:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --locked
